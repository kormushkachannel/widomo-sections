<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, World!</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Onest:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fb;--fg:#12263f;--accent:#1f6feb;--muted:#5b6b80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--fg:#eaf1fb;--accent:#6ea8ff;--muted:#93a4bb}}
:root[data-theme="dark"]{--bg:#0e1a2b;--fg:#eaf1fb;--accent:#6ea8ff;--muted:#93a4bb}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Onest',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
main{padding:24px}
h1{font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:clamp(2.2rem,9vw,5.5rem);margin:0;letter-spacing:-.02em}
p{color:var(--muted);font-size:1.15rem;margin:1rem 0 1.6rem}
button{font:inherit;background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:.7em 1.6em;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1 id="t">Hello, World!</h1>
<p>Моя перша сторінка</p>
<button id="b">Привітатися</button>
</main>
<script>
var g=["Hello, World!","Привіт, світе!","Hola, mundo!","Hallo, Welt!","Bonjour, monde!"],i=0;
document.getElementById("b").onclick=function(){i=(i+1)%g.length;document.getElementById("t").textContent=g[i]};
</script>
</body>
</html>
